{% extends "base.html" %}{% block title %}AlyaNovel.ru · админка{% endblock %}{% block body %}
<a class="exit" href="/">← На главную</a>
<div class="card" style="max-width:360px;margin:12vh auto">
<h2>Вход для администраторов</h2>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" action="/admin/login">
<label>Логин</label><input name="login" autocomplete="username" required>
<label>Пароль</label><input name="password" type="password" autocomplete="current-password" required>
<button>Войти</button></form>
</div>{% endblock %}
