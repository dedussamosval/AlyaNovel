version: 1
disable_existing_loggers: false

formatters:
  console_default:
    (): uvicorn.logging.DefaultFormatter
    fmt: "%(levelprefix)s %(asctime)s | %(message)s"
    use_colors: true

  console_access:
    (): uvicorn.logging.AccessFormatter
    fmt: '%(levelprefix)s %(asctime)s | %(client_addr)s - "%(request_line)s" %(status_code)s'
    use_colors: true

  file_all:
    format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    formatter: console_default
    stream: ext://sys.stderr

  console_access:
    class: logging.StreamHandler
    formatter: console_access
    stream: ext://sys.stdout

  file:
    class: logger.DatedFileHandler
    formatter: file_all
    filename: logs/AlyaNovel_{date}.log
    encoding: utf-8


loggers:
  uvicorn:
    handlers:
      - console
      - file
    level: INFO
    propagate: false

  uvicorn.error:
    handlers:
      - console
      - file
    level: INFO
    propagate: false

  uvicorn.access:
    handlers:
      - console_access
      - file
    level: INFO
    propagate: false

root:
  handlers:
    - console
    - file
  level: INFO
